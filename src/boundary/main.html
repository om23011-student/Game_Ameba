<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ameba - Juego Equis Cero</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/game_ameba.css">
</head>
<body>
<!-- A) Pantalla de carga -->
<div id="loading-screen" class="active">
    <div class="loader"></div>
    <h2>cargando experiencia personalizada xd</h2>
</div>
<!-- Menú Principal -->
<div id="menu-screen">
    <h1>layout de menu</h1>
    <!-- B) Modo de juego -->
    <div class="form-group">
        <label>Modalidad de enfrentamiento:</label>
        <select id="game-mode">
            <option value="pvp">Jugador vs Jugador</option>
            <option value="pve">Jugador vs Máquina</option>
            <option value="eve">DEMO</option>
        </select>
    </div>
    <!-- C) Dimensiones del canvas / Tablero -->
    <div class="form-group">
        <label>Tamanio del grid (Mínimo 5x5):</label>
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <div style="flex: 1;">
                Columnas: <input type="number" id="grid-cols" value="5" min="5">
            </div>
            <div style="flex: 1;">
                Filas: <input type="number" id="grid-rows" value="5" min="5">
            </div>
        </div>
    </div>
    <!-- D) Selección de figura (Equis o Cero) -->
    <div class="form-group">
        <label>Jugador 1 elige figura:</label>
        <select id="player-symbol">
            <option value="X">Equis (X)</option>
            <option value="0">Cero (0)</option>
        </select>
        <small style="color:#bdc3c7; display:block; margin-top: 5px;">El Jugador 2 tendrá la figura opuesta.</small>
    </div>
    <!-- E) Botón de inicio -->
    <button id="btn-start">Iniciar Partida</button>
</div>
<!-- Pantalla de Juego interactiva -->
<div id="game-screen">
    <h2 id="game-title">Amoeba Game</h2>

    <!-- G) Tablero de turnos -->
    <div id="turn-board" class="turn-board">
        <div id="turn-p1" class="turn-box">Jugador 1</div>
        <div id="turn-p2" class="turn-box">Jugador 2</div>
    </div>

    <canvas id="miCanvas" width="800" height="800"></canvas>
    <button id="btn-restart">Volver al Menú</button>
</div>

<!-- Lgica de interaccin de ventanas del men -->
<script src="../js/complements/GestorVentanas.js"></script>
<!-- Lógica WebGL del Juego -->
<script type="module" src="../js/core/game_ameba.js"></script>
</body>
</html>
